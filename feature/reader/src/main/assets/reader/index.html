<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Polyglot Books Reader</title>
  <style>
    :root {
      color-scheme: light;
      --bg-color: #FFFFFF;
      --text-color: #1A1A1A;
      --muted-color: #555555;
      --surface-color: #F5F5F5;
      --border-color: #DDDDDD;
      --highlight-bg: rgba(255, 235, 59, 0.45);
      --accent-color: #1976D2;
    }

    html.theme-light,
    body.theme-light {
      color-scheme: light;
      --bg-color: #FFFFFF;
      --text-color: #1A1A1A;
      --muted-color: #555555;
      --surface-color: #F5F5F5;
      --border-color: #DDDDDD;
      --highlight-bg: rgba(255, 235, 59, 0.45);
      --accent-color: #1976D2;
    }

    html.theme-sepia,
    body.theme-sepia {
      color-scheme: light;
      --bg-color: #F4ECD8;
      --text-color: #5C4033;
      --muted-color: #7A5C4E;
      --surface-color: #EAE0C8;
      --border-color: #D6C7A9;
      --highlight-bg: rgba(218, 165, 32, 0.35);
      --accent-color: #8D5524;
    }

    html.theme-dark,
    body.theme-dark {
      color-scheme: dark;
      --bg-color: #121212;
      --text-color: #E0E0E0;
      --muted-color: #B0B0B0;
      --surface-color: #1E1E1E;
      --border-color: #333333;
      --highlight-bg: rgba(255, 193, 7, 0.30);
      --accent-color: #90CAF9;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      height: auto;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #reader-container {
      margin: 0;
      width: 100%;
      min-height: 100%;
      height: auto;
      overflow-y: visible;
      box-sizing: border-box;
      padding: 20px 20px 48px 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.65;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    p, div, span, li, h1, h2, h3, h4, h5, h6, blockquote, a {
      color: var(--text-color);
    }

    a {
      color: var(--accent-color);
    }

    h1, h2, h3, h4, h5, h6 {
      margin-top: 1.1em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }

    p {
      line-height: 1.65;
      margin-top: 0;
      margin-bottom: 1em;
    }

    blockquote {
      margin: 1em 0;
      padding: 0.4em 1em;
      border-left: 3px solid var(--border-color);
      background-color: var(--surface-color);
      border-radius: 0 4px 4px 0;
    }

    img, svg {
      max-width: 100%;
      height: auto;
    }

    .chapter-header {
      font-size: 1.25em;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 1em;
      padding-bottom: 0.4em;
      border-bottom: 1px solid var(--border-color);
    }

    .highlight-active {
      background-color: var(--highlight-bg) !important;
      border-radius: 4px;
      padding: 3px 6px;
    }

    .bilingual-translation {
      color: var(--muted-color) !important;
      font-size: 0.92em;
      font-style: italic;
      margin-top: -0.4em;
      margin-bottom: 1em;
      padding: 6px 10px;
      border-left: 3px solid var(--accent-color);
      background-color: var(--surface-color);
      border-radius: 0 4px 4px 0;
    }

    .loading-state,
    .error-state {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      text-align: center;
      color: var(--muted-color);
      font-size: 16px;
    }

    .pdf-viewer {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pdf-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
    }

    .pdf-nav-btn {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .pdf-nav-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .pdf-page-frame {
      width: 100%;
      background-color: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .pdf-page-img {
      display: block;
      width: 100%;
      height: auto;
      background-color: #FFFFFF;
    }

    .pdf-text-section {
      margin-top: 8px;
      padding: 10px 12px;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .pdf-text-section summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: var(--muted-color);
      margin-bottom: 8px;
    }
  </style>
</head>
<body class="theme-light">
  <div id="reader-container">
    <div id="loading-indicator" class="loading-state">Loading book…</div>
  </div>
  <script src="foliate-bridge.js"></script>
</body>
</html>
