name: AI output report
description: Report unexpected, inaccurate, or offensive AI-generated content (translation or narration).
labels: [ai-output]
body:
  - type: markdown
    attributes:
      value: |
        Reports here help improve prompt engineering and safety filters, in line with Google Play's AI-Generated Content Policy. Please don't paste API keys or personal data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the unexpected, inaccurate, or offensive output.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Translation output
        - Narration / audiobook playback
        - Reader
        - Other
    validations:
      required: true
  - type: input
    id: languages
    attributes:
      label: Language(s) involved
      placeholder: e.g. English → Spanish
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example output
      description: Optional. Paste or summarize the relevant output.
    validations:
      required: false
